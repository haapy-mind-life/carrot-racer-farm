name: Format Unified Controls Once
on:
  push:
    branches: [fix/unified-world-ocean-house-progression-20261011]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format unified controls')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx prettier --write src/components/hyunjun/Village.tsx src/components/hyunjun/UnifiedCoast.tsx src/components/hyunjun/LifeWorldScene.tsx src/components/hyunjun/adventure.css
      - name: Push formatted controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/hyunjun/Village.tsx src/components/hyunjun/UnifiedCoast.tsx src/components/hyunjun/LifeWorldScene.tsx src/components/hyunjun/adventure.css
          if ! git diff --cached --quiet; then
            git commit -m "chore: format unified controls"
            git push origin HEAD:fix/unified-world-ocean-house-progression-20261011
          fi
