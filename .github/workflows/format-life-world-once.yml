name: Format Life World Feature Once
on:
  push:
    branches: [feat/hyunjun-open-world-life-ocean-foodtruck-20261011]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format life world feature')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prettier changed source files
        run: npx prettier --write src/game/life-world.ts src/game/life-world.test.ts src/components/hyunjun/LifeWorldScene.tsx src/components/hyunjun/Village.tsx src/components/hyunjun/adventure.css src/lib/world-model.ts src/lib/world-model.test.ts
      - name: Commit and push formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/life-world.ts src/game/life-world.test.ts src/components/hyunjun/LifeWorldScene.tsx src/components/hyunjun/Village.tsx src/components/hyunjun/adventure.css src/lib/world-model.ts src/lib/world-model.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: format life world feature"
            git push origin HEAD:feat/hyunjun-open-world-life-ocean-foodtruck-20261011
          fi
