name: Format Unified World Once
on:
  push:
    branches: [fix/unified-world-ocean-house-progression-20261011]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format unified world')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx prettier --write src/game/adventure.ts src/game/unified-world.ts src/game/unified-world.test.ts src/game/adventure.test.ts src/game/touch-world.test.ts src/lib/world-model.ts src/lib/world-model.test.ts src/components/hyunjun/Village.tsx src/components/hyunjun/UnifiedCoast.tsx
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/adventure.ts src/game/unified-world.ts src/game/unified-world.test.ts src/game/adventure.test.ts src/game/touch-world.test.ts src/lib/world-model.ts src/lib/world-model.test.ts src/components/hyunjun/Village.tsx src/components/hyunjun/UnifiedCoast.tsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: format unified world"
            git push origin HEAD:fix/unified-world-ocean-house-progression-20261011
          fi
