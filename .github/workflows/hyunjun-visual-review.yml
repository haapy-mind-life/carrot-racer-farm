name: Hyunjun Visual Review

on:
  push:
    branches: ["feat/hyunjun-integrated-game"]

permissions:
  contents: read

jobs:
  browser-acceptance:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm run build
      - name: Install browser QA helper
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/hyunjun-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hyunjun-dev.log
          exit 1
      - name: Mobile browser acceptance
        run: node scripts/hyunjun-browser-acceptance.mjs
