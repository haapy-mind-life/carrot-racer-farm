name: Hyunjun Visual Review

on:
  push:
    branches: ["feat/hyunjun-integrated-game"]

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hyunjun-integrated-game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm run build
      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/hyunjun-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hyunjun-dev.log
          exit 1
      - name: Capture four mobile screens
        run: |
          mkdir -p docs/visual-review
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=docs/visual-review/home.png http://127.0.0.1:4173/
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=docs/visual-review/runner.png http://127.0.0.1:4173/race
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=docs/visual-review/farm.png http://127.0.0.1:4173/greenhouse
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=docs/visual-review/house.png http://127.0.0.1:4173/house
          test -s docs/visual-review/home.png
          test -s docs/visual-review/runner.png
          test -s docs/visual-review/farm.png
          test -s docs/visual-review/house.png
      - name: Commit temporary review images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-review
          git commit -m "test: capture temporary Hyunjun mobile screens"
          git push origin HEAD:feat/hyunjun-integrated-game
