name: Format Vehicle Feature
on:
  push:
    branches: [feat/hyunjun-100-cars-friends-pages-20261011]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format vehicle feature')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format exactly the changed feature files
        run: npx prettier --write src/game/cars.ts src/game/cars.test.ts src/components/hyunjun/CarArt.tsx src/components/hyunjun/FriendArt.tsx src/components/hyunjun/Garage.tsx src/components/hyunjun/Village.tsx
      - name: Push formatted feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/cars.ts src/game/cars.test.ts src/components/hyunjun/CarArt.tsx src/components/hyunjun/FriendArt.tsx src/components/hyunjun/Garage.tsx src/components/hyunjun/Village.tsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: format vehicle feature"
            git push origin HEAD:feat/hyunjun-100-cars-friends-pages-20261011
          fi
