name: Format Final Life World Changes
on:
  push:
    branches: [feat/hyunjun-open-world-life-ocean-foodtruck-20261011]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format final life world changes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx prettier --write src/game/cars.ts src/game/cars.test.ts src/game/life-world.ts src/components/hyunjun/CarArt.tsx src/components/hyunjun/Garage.tsx src/components/hyunjun/Village.tsx src/components/hyunjun/LifeWorldScene.tsx
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/cars.ts src/game/cars.test.ts src/game/life-world.ts src/components/hyunjun/CarArt.tsx src/components/hyunjun/Garage.tsx src/components/hyunjun/Village.tsx src/components/hyunjun/LifeWorldScene.tsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: format final life world changes"
            git push origin HEAD:feat/hyunjun-open-world-life-ocean-foodtruck-20261011
          fi
